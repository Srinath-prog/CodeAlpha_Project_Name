<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Music Player</title>
  <style>
    body {
      background: black;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      margin: 0;
    }

    .player {
      background: black;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      text-align: center;
      width: 300px;
    }

    .player h2 {
      margin-bottom: 10px;
    }

    .controls button {
      background: green;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 10px 5px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    .controls button:hover {
      background: green;
    }

    .info {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="player">
    <h2>My Music Player</h2>
    <audio id="audioPlayer" src="song.mp3"></audio>
    <div class="controls">
      <button id="playBtn">Play</button>
      <button id="stopBtn">Stop</button>
    </div>
    <div class="info">
      <p>Now Playing: <span id="songTitle">song.mp3</span></p>
    </div>
  </div>

  <script>
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const audio = document.getElementById('audioPlayer');

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playBtn.textContent = 'Pause';
      } else {
        audio.pause();
        playBtn.textContent = 'Play';
      }
    });

    stopBtn.addEventListener('click', () => {
      audio.pause();
      audio.currentTime = 0;
      playBtn.textContent = 'Play';
    });
  </script>
</body>
</html>
